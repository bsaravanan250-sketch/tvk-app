name: Deep dive

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Yahoo Finance symbol, e.g. RELIANCE.NS or AAPL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deep-dive-${{ inputs.symbol }}
  cancel-in-progress: false

jobs:
  deepdive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deep dive
        working-directory: stock-analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q anthropic; fi
          python3 deepdive.py "${{ inputs.symbol }}"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-analyzer/data/deepdive/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Deep dive: ${{ inputs.symbol }} ($(TZ=Asia/Kolkata date +%F))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
