name: Stock analyzer tests

on:
  push:
    paths: ["stock-analyzer/**", ".github/workflows/stock-analyzer-tests.yml"]
  pull_request:
    paths: ["stock-analyzer/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: stock-analyzer
        run: python3 -m unittest discover -s tests -v
      - name: Offline pipeline run
        working-directory: stock-analyzer
        run: python3 analyze.py --offline --out /tmp/brief && python3 -c "import json;b=json.load(open('/tmp/brief/sample-brief.json'));assert b['stocks'],'empty brief'"
